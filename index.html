<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('guna-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.setAttribute('data-intro', '');
        } catch (e) {}
      })();
    </script>
    <title>Guna Bala D — AI/ML Engineer</title>

      property="og:description"
